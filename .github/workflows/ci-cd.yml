name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  # 1. Testing Setup Skill: Web & Android Unit Tests, Roborazzi Screenshot Tests & Jacoco Coverage
  testing_setup:
    name: Testing Setup & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Web Dependencies
        run: pnpm install

      - name: Run Web Unit Tests & Vitest
        run: pnpm test

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Run Android Unit & Roborazzi Screenshot Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Generate Jacoco Coverage Report
        run: ./gradlew jacocoTestReport --no-daemon

      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: app/build/reports/jacoco/jacocoTestReport/html/

  # 2. Play Policy Insights Skill: Automated Audit of Target SDK, Permissions & Foreground Services
  play_policy_insights:
    name: Play Policy Insights Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Play Policy Insights Audit
        run: python3 scripts/play_policy_insights.py app/src/main/AndroidManifest.xml

  # 3. R8 Analyzer Skill: Code Shrinking, Tree-Shaking & ProGuard Rule Verification
  r8_analyzer:
    name: R8 Tree-Shaking & Size Analyzer
    runs-on: ubuntu-latest
    needs: [testing_setup, play_policy_insights]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Build Release APK & Generate R8 Mapping
        run: ./gradlew assembleRelease --no-daemon

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run R8 Analyzer Report
        run: python3 scripts/r8_analyzer.py app/build/outputs/mapping/release/mapping.txt app/build/outputs/mapping/release/usage.txt

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: musically-release-apk
          path: app/build/outputs/apk/release/*.apk

  # 4. Perfetto Trace Analysis Skill: Startup TTID/TTFD & Frame Drop SLAs
  perfetto_trace_analysis:
    name: Perfetto System Trace & Performance Analysis
    runs-on: ubuntu-latest
    needs: [r8_analyzer]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Perfetto System Trace Analysis
        run: python3 scripts/perfetto_analyzer.py app/build/outputs/trace.perfetto-trace

  # 5. Production Web Deployment to Firebase App Hosting
  deploy_web:
    name: Deploy Web Application
    runs-on: ubuntu-latest
    needs: [testing_setup]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - run: pnpm install
      - run: pnpm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MUSICALLY_STUDIO }}'
          channelId: live
          projectId: musically-studio
