name: Meta Wearables WDAT CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  validate_web_applet:
    name: Build & Audit Web Applet & Functions
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Root Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Web Applet Production Assets
        run: pnpm run build

      - name: Install & Build Firebase Cloud Functions
        run: |
          cd functions
          pnpm install --no-frozen-lockfile
          pnpm run build

  validate_android_companion:
    name: Build & Test Android Companion
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Configure WDAT Secrets & Repositories
        env:
          MOCK_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.gradle
          echo "github_token=${{ secrets.META_WDAT_READ_TOKEN || secrets.GITHUB_TOKEN }}" > local.properties
          if [ ! -f "MWDAT.plist" ]; then
            echo "<plist version=\"1.0\"><dict><key>CLIENT_TOKEN</key><string>0</string></dict></plist>" > MWDAT.plist
          fi

      - name: Compile Kotlin Companion Classes
        run: ./gradlew :shared:compileDebugKotlinAndroid --no-daemon

      - name: Package Companion Android APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Archive Android Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: companion-app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

