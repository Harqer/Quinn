name: Mave Studio CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate_web_applet:
    name: Build & Audit Web Applet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Root Dependencies
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile

      - name: Build Web Applet Production Assets
        run: pnpm run build

  validate_cloud_functions:
    name: Build & Audit Firebase Cloud Functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Build Firebase Cloud Functions
        run: |
          cd functions
          pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
          pnpm run build

  validate_go_backend:
    name: Build & Test Go Cloud Run Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Build Go Server
        run: |
          cd backend
          go build -v ./cmd/server

      - name: Run Go Unit Tests
        run: |
          cd backend
          go test -v ./...

  validate_android_companion:
    name: Build & Test Android Multi-Module Companion
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure WDAT Secrets & Manifest Placeholders
        env:
          MOCK_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.gradle
          echo "github_token=${{ secrets.META_WDAT_READ_TOKEN || secrets.GITHUB_TOKEN }}" > local.properties
          if [ ! -f "MWDAT.plist" ]; then
            echo "<plist version=\"1.0\"><dict><key>CLIENT_TOKEN</key><string>0</string></dict></plist>" > MWDAT.plist
          fi

      - name: Compile Kotlin Companion Classes Across Modules
        run: ./gradlew :shared:compileDebugKotlinAndroid :tv:compileDebugKotlinAndroid :wear:compileDebugKotlinAndroid --no-daemon

      - name: Package Companion Android APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Archive Android Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: companion-app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
