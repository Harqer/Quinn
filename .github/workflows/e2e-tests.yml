name: E2E Tests (Firebase Robo & Maestro)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build debug APK
      run: ./gradlew assembleDebug

    - name: Install Maestro
      run: curl -Ls "https://get.maestro.mobile.dev" | bash

    # Note: To run Maestro in CI, you either need a connected emulator, or you can use Maestro Cloud.
    # - name: Run Maestro Cloud
    #   run: ~/.maestro/bin/maestro cloud app/build/outputs/apk/debug/app-debug.apk .maestro/flow.yaml
    #   env:
    #     MAESTRO_CLOUD_API_KEY: ${{ secrets.MAESTRO_CLOUD_API_KEY }}

    # Firebase Test Lab (Robo Test)
    # Automatically crawls the UI for crashes and broken flows.
    - name: Run Firebase Robo Test
      run: |
        echo "To enable Firebase Test Lab, uncomment the lines below and add your SERVICE_ACCOUNT_JSON to GitHub Secrets."
        # echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" > service-account.json
        # gcloud auth activate-service-account --key-file=service-account.json
