# -------------------------------------
# DOMAIN: USERS & SOCIAL
# -------------------------------------
enum SubscriptionTier { FREE PREMIUM FAMILY }

type User @table(key: "uid") {
  uid: String! @default(expr: "auth.uid")
  username: String! @unique
  email: String! @unique
  displayName: String
  avatarUrl: String
  subscriptionTier: SubscriptionTier! @default(value: FREE)
  region: String
  favoriteArtists: [String!]
  favoriteGenres: [String!]
  createdAt: Timestamp! @default(expr: "request.time")
}

type AuthIdentity @table(key: ["provider", "providerSubject"]) {
  provider: String!
  providerSubject: String!
  user: User!
  createdAt: Timestamp! @default(expr: "request.time")
}

type UserSettings @table(key: "userId") {
  userId: String! @default(expr: "auth.uid")
  user: User! @unique
  isPremium: Boolean! @default(value: false)
  theme: String! @default(value: "dark")
  parentalControlsEnabled: Boolean! @default(value: false)
  stripeCustomerId: String
}

type PaymentHistory @table {
  id: String! @default(expr: "uuidV4()")
  user: User!
  amount: Float!
  currency: String! @default(value: "usd")
  status: String!
  stripeInvoiceId: String
  createdAt: Timestamp! @default(expr: "request.time")
}

type Playlist @table {
  id: String! @default(expr: "uuidV4()")
  name: String!
  description: String
  owner: User!
  isPublic: Boolean! @default(value: true)
  isCollaborative: Boolean! @default(value: false)
  coverUrl: String
  createdAt: Timestamp! @default(expr: "request.time")
}

type PlaylistEntry @table(key: ["playlist", "track"]) {
  playlist: Playlist!
  track: Track!
  addedBy: User!
  orderIndex: Int
  addedAt: Timestamp! @default(expr: "request.time")
}

# -------------------------------------
# DOMAIN: MUSIC CATALOG
# -------------------------------------
type Artist @table {
  id: String! @default(expr: "uuidV4()")
  name: String! @searchable
  bio: String
  monthlyListeners: Int
  imageUrl: String
}

type Album @table {
  id: String! @default(expr: "uuidV4()")
  title: String! @searchable
  primaryArtist: Artist!
  releaseDate: Date
  label: String
  coverUrl: String
}

type Track @table {
  id: String! @default(expr: "uuidV4()")
  title: String! @searchable
  album: Album
  durationMs: Int! @default(value: 0)
  isrcCode: String @unique
  audioUrl: String!
  coverUrl: String
  playCount: Int64! @default(value: 0)
  
  # Lyria-specific AI Generation Metadata
  prompt: String
  visibility: String! @default(value: "public")
  owner: User!
  isCommunity: Boolean! @default(value: false)
  createdAt: Timestamp! @default(expr: "request.time")
}

# Many-to-Many: Track <-> Artist
type TrackArtist @table(key: ["track", "artist"]) {
  track: Track!
  artist: Artist!
  role: String! # e.g., 'primary', 'featured', 'producer'
}

type LikedTrack @table(key: ["user", "track"]) {
  user: User!
  track: Track!
  addedAt: Timestamp! @default(expr: "request.time")
}

type BookmarkedTrack @table(key: ["user", "track"]) {
  user: User!
  track: Track!
  addedAt: Timestamp! @default(expr: "request.time")
}

# -------------------------------------
# DOMAIN: PODCASTS CATALOG
# -------------------------------------
type Show @table {
  id: String! @default(expr: "uuidV4()")
  title: String! @searchable
  publisher: String!
  description: String
  rssFeedUrl: String
  coverUrl: String
  isExclusive: Boolean! @default(value: false)
}

type Episode @table {
  id: String! @default(expr: "uuidV4()")
  show: Show!
  title: String! @searchable
  description: String
  publishDate: Timestamp
  durationMs: Int!
  audioUrl: String!
}

type UserEpisodeProgress @table(key: ["user", "episode"]) {
  user: User!
  episode: Episode!
  progressMs: Int!
  lastPlayedAt: Timestamp! @default(expr: "request.time")
}

# -------------------------------------
# DOMAIN: AUDIOBOOKS CATALOG
# -------------------------------------
type Author @table {
  id: String! @default(expr: "uuidV4()")
  name: String! @searchable
  bio: String
}

type Audiobook @table {
  id: String! @default(expr: "uuidV4()")
  title: String! @searchable
  author: Author!
  narrator: String
  isbn: String
  coverUrl: String
  totalDurationMs: Int
}

type Chapter @table {
  id: String! @default(expr: "uuidV4()")
  audiobook: Audiobook!
  title: String!
  chapterNumber: Int!
  durationMs: Int!
  audioUrl: String!
}

# -------------------------------------
# CATEGORIES & TAXONOMY (Many-to-Many)
# -------------------------------------
enum CategoryType { GENRE MOOD ACTIVITY }

type Category @table {
  id: String! @default(expr: "uuidV4()")
  name: String! @unique
  type: CategoryType!
}

type MusicCategory @table(key: ["track", "category"]) {
  track: Track!
  category: Category!
}

type PodcastCategory @table(key: ["show", "category"]) {
  show: Show!
  category: Category!
}

# -------------------------------------
# LYRIA-SPECIFIC: CAPTURES & GENERATION
# -------------------------------------
type CameraCapture @table {
  id: String! @default(expr: "uuidV4()")
  user: User!
  imageUrl: String
  videoUrl: String
  environmentData: String # The metadata/vibe extracted from the environment
  generatedTrack: Track   # The track generated from this capture, if any
  createdAt: Timestamp! @default(expr: "request.time")
}

type VideoDigestion @table {
  id: String! @default(expr: "uuidV4()")
  user: User!
  videoUrl: String!
  extractedAudioUrl: String
  atmosphereSummary: String # AI summary of the video's vibe
  generatedTrack: Track
  createdAt: Timestamp! @default(expr: "request.time")
}

# -------------------------------------
# CHAT & AI
# -------------------------------------
type ChatMessage @table {
  id: String! @default(expr: "uuidV4()")
  user: User!
  sender: String! # "user" or "ai"
  text: String!
  createdAt: Timestamp! @default(expr: "request.time")
}

# -------------------------------------
# PREMIUM & APP CONTENT
# -------------------------------------
type SubscriptionPlan @table {
  id: String! @default(expr: "uuidV4()")
  name: String!
  tier: SubscriptionTier! @unique
  priceMonthly: Float!
  priceAnnually: Float!
  description: String!
  isActive: Boolean! @default(value: true)
}

type SubscriptionFeature @table(key: ["plan", "feature"]) {
  plan: SubscriptionPlan!
  feature: String!
}

type FaqItem @table {
  id: String! @default(expr: "uuidV4()")
  question: String!
  answer: String!
  orderIndex: Int!
}

type AIPreset @table {
  id: String! @default(expr: "uuidV4()")
  name: String!
  promptFragment: String!
  imageUrl: String
  isActive: Boolean! @default(value: true)
}

type FeatureHighlight @table {
  id: String! @default(expr: "uuidV4()")
  iconName: String!
  title: String!
  description: String!
}

type HomeSection @table {
  id: String! @default(expr: "uuidV4()")
  title: String!
  orderIndex: Int!
  route: String!
}
