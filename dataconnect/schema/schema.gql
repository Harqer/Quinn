type User @table(key: "uid") {
  uid: String! @default(expr: "auth.uid")
  displayName: String
  email: String
  avatarUrl: String
  favoriteArtists: [String!]
  favoriteGenres: [String!]
}

type AuthIdentity @table(key: ["provider", "providerSubject"]) {
  provider: String!
  providerSubject: String!
  user: User!
  createdAt: Timestamp! @default(expr: "request.time")
}

type UserSettings @table(key: "userId") {
  userId: String! @default(expr: "auth.uid")
  user: User! @unique
  isPremium: Boolean! @default(value: false)
  theme: String! @default(value: "dark")
  parentalControlsEnabled: Boolean! @default(value: false)
  stripeCustomerId: String
}

type PaymentHistory @table {
  id: String! @default(expr: "uuidV4()")
  user: User!
  amount: Float!
  currency: String! @default(value: "usd")
  status: String!
  stripeInvoiceId: String
  createdAt: Timestamp! @default(expr: "request.time")
}

type Track @table {
  id: String! @default(expr: "uuidV4()")
  name: String!
  artistName: String!
  albumName: String!
  imageUrl: String
  audioUrl: String
  prompt: String
  visibility: String! @default(value: "public")
  createdAt: Timestamp! @default(expr: "request.time")
  owner: User!
  isCommunity: Boolean! @default(value: false)
}

type Category @table {
  id: String! @default(expr: "uuidV4()")
  name: String!
  imageUrl: String
  type: String! # e.g., "MUSIC", "PODCAST", "AUDIOBOOK"
}

type Playlist @table {
  id: String! @default(expr: "uuidV4()")
  name: String!
  description: String
  imageUrl: String
  owner: User!
  isPublic: Boolean! @default(value: true)
}

type PlaylistEntry @table(key: ["playlist", "track"]) {
  playlist: Playlist!
  track: Track!
  addedAt: Timestamp! @default(expr: "request.time")
}

type Album @table {
  id: String! @default(expr: "uuidV4()")
  name: String!
  artistName: String!
  imageUrl: String
  releaseYear: Int
}

type Podcast @table {
  id: String! @default(expr: "uuidV4()")
  name: String!
  publisher: String!
  imageUrl: String
  description: String
}

type PodcastEpisode @table {
  id: String! @default(expr: "uuidV4()")
  podcast: Podcast!
  title: String!
  duration: Int
  publishDate: Timestamp
  audioUrl: String
}

type Audiobook @table {
  id: String! @default(expr: "uuidV4()")
  title: String!
  author: String!
  narrator: String
  imageUrl: String
  duration: Int
  audioUrl: String
}

type LikedTrack @table(key: ["user", "track"]) {
  user: User!
  track: Track!
  addedAt: Timestamp! @default(expr: "request.time")
}

type BookmarkedTrack @table(key: ["user", "track"]) {
  user: User!
  track: Track!
  addedAt: Timestamp! @default(expr: "request.time")
}

type CameraCapture @table {
  id: String! @default(expr: "uuidV4()")
  user: User!
  imageUrl: String
  videoUrl: String
  environmentData: String # The metadata/vibe extracted from the environment
  generatedTrack: Track   # The track generated from this capture, if any
  createdAt: Timestamp! @default(expr: "request.time")
}

type VideoDigestion @table {
  id: String! @default(expr: "uuidV4()")
  user: User!
  videoUrl: String!
  extractedAudioUrl: String
  atmosphereSummary: String # AI summary of the video's vibe
  generatedTrack: Track
  createdAt: Timestamp! @default(expr: "request.time")
}
