mutation CreateTrack(
  $title: String!,
  $albumId: String,
  $audioUrl: String!,
  $coverUrl: String,
  $durationMs: Int,
  $prompt: String,
  $isCommunity: Boolean!
) @auth(level: USER) {
  track_insert(data: {
    title: $title,
    albumId: $albumId,
    audioUrl: $audioUrl,
    coverUrl: $coverUrl,
    durationMs: $durationMs,
    prompt: $prompt,
    isCommunity: $isCommunity,
    ownerUid_expr: "auth.uid"
  })
}

mutation UpsertUser(
  $displayName: String,
  $username: String!,
  $email: String!
) @auth(level: USER) {
  user_upsert(data: {
    uid_expr: "auth.uid",
    displayName: $displayName,
    username: $username,
    email: $email
  })
}

mutation CreatePlaylist(
  $name: String!,
  $description: String
) @auth(level: USER) {
  playlist_insert(data: {
    name: $name,
    description: $description,
    ownerUid_expr: "auth.uid"
  })
}

mutation AddTrackToPlaylist(
  $playlistId: String!,
  $trackId: String!
) @auth(level: USER) {
  playlistEntry_insert(data: {
    playlistId: $playlistId,
    trackId: $trackId,
    addedByUid_expr: "auth.uid"
  })
}

mutation CreatePodcast(
  $title: String!,
  $publisher: String!,
  $coverUrl: String,
  $description: String
) @auth(level: PUBLIC) {
  show_insert(data: {
    title: $title,
    publisher: $publisher,
    coverUrl: $coverUrl,
    description: $description
  })
}

mutation UpsertUserSettings(
  $theme: String,
  $parentalControlsEnabled: Boolean,
  $stripeCustomerId: String
) @auth(level: USER) {
  userSettings_upsert(data: {
    userId_expr: "auth.uid",
    userUid_expr: "auth.uid",
    theme: $theme,
    parentalControlsEnabled: $parentalControlsEnabled,
    stripeCustomerId: $stripeCustomerId
  })
}

mutation UpdateUserPreferences(
  $favoriteArtists: [String!],
  $favoriteGenres: [String!]
) @auth(level: USER) {
  user_update(
    key: { uid_expr: "auth.uid" },
    data: {
      favoriteArtists: $favoriteArtists,
      favoriteGenres: $favoriteGenres
    }
  )
}

mutation RecordPayment(
  $userUid: String!,
  $amount: Float!,
  $currency: String!,
  $status: String!,
  $stripeInvoiceId: String
) @auth(level: NO_ACCESS) {
  paymentHistory_insert(data: {
    userUid: $userUid,
    amount: $amount,
    currency: $currency,
    status: $status,
    stripeInvoiceId: $stripeInvoiceId
  })
}

mutation LikeTrack($trackId: String!) @auth(level: USER) {
  likedTrack_upsert(data: {
    userUid_expr: "auth.uid",
    trackId: $trackId
  })
}

mutation RemoveLikedTrack($trackId: String!) @auth(level: USER) {
  likedTrack_delete(key: {
    userUid_expr: "auth.uid",
    trackId: $trackId
  })
}

mutation BookmarkTrack($trackId: String!) @auth(level: USER) {
  bookmarkedTrack_insert(data: {
    userUid_expr: "auth.uid",
    trackId: $trackId
  })
}

mutation RemoveBookmarkedTrack($trackId: String!) @auth(level: USER) {
  bookmarkedTrack_delete(key: {
    userUid_expr: "auth.uid",
    trackId: $trackId
  })
}

mutation CreateCameraCapture(
  $imageUrl: String,
  $videoUrl: String,
  $environmentData: String,
  $generatedTrackId: String
) @auth(level: USER) {
  cameraCapture_insert(data: {
    userUid_expr: "auth.uid",
    imageUrl: $imageUrl,
    videoUrl: $videoUrl,
    environmentData: $environmentData,
    generatedTrackId: $generatedTrackId
  })
}

mutation CreateVideoDigestion(
  $videoUrl: String!,
  $extractedAudioUrl: String,
  $atmosphereSummary: String,
  $generatedTrackId: String
) @auth(level: USER) {
  videoDigestion_insert(data: {
    userUid_expr: "auth.uid",
    videoUrl: $videoUrl,
    extractedAudioUrl: $extractedAudioUrl,
    atmosphereSummary: $atmosphereSummary,
    generatedTrackId: $generatedTrackId
  })
}
