query GetPlaylistTracks($playlistId: String!) @auth(level: PUBLIC) {
  playlistEntries(where: { playlist: { id: { eq: $playlistId } } }, orderBy: [{ orderIndex: ASC }]) {
    track {
      id
      title
      album {
        id
        title
        primaryArtist {
          id
          name
        }
      }
      coverUrl
      audioUrl
      prompt
      visibility
      isCommunity
      createdAt
    }
  }
}

query GetCategoryTracks($categoryId: String!) @auth(level: PUBLIC) {
  musicCategories(where: { category: { id: { eq: $categoryId } } }) {
    track {
      id
      title
      album {
        id
        title
        primaryArtist {
          id
          name
        }
      }
      coverUrl
