}

query SearchTracks($query: String!) @auth(level: PUBLIC) {
  tracks(where: { title: { contains: $query }, isCommunity: { eq: true } }, orderBy: [{ createdAt: DESC }]) {
    id
    title
    album {
      id
      title
      primaryArtist {
        id
        name
      }
    }
    coverUrl
    audioUrl
    prompt
    visibility
    isCommunity
    createdAt
  }
}

# -------------------------------------
# CHAT & AI
# -------------------------------------
query ListChatMessages($userId: String!) @auth(level: USER) {
  chatMessages(where: { user: { uid: { eq: $userId } } }, orderBy: [{ createdAt: ASC }]) {
    id
    sender
    text
    createdAt
  }
}

# -------------------------------------
# PREMIUM & APP CONTENT
# -------------------------------------
query ListSubscriptionPlans @auth(level: PUBLIC) {
  subscriptionPlans(where: { isActive: { eq: true } }, orderBy: [{ priceMonthly: ASC }]) {
    id
    name
    tier
    priceMonthly
    priceAnnually
    description
    features: subscriptionFeatures_on_plan {
      feature
    }
  }
}

query ListFaqItems @auth(level: PUBLIC) {
  faqItems(orderBy: [{ orderIndex: ASC }]) {
    id
    question
    answer
  }
}

query ListAIPresets @auth(level: PUBLIC) {
  aIPresets(where: { isActive: { eq: true } }) {
    id
    name
    promptFragment
    imageUrl
  }
}
