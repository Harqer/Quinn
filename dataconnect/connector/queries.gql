query GetAlbumTracks($albumId: String!) @auth(level: PUBLIC) {
  tracks(where: { album: { id: { eq: $albumId } } }, orderBy: [{ createdAt: DESC }]) {
    id
    title
    album {
      id
      title
      primaryArtist {
        id
        name
      }
    }
    coverUrl
    audioUrl
    prompt
    visibility
    isCommunity
    createdAt
