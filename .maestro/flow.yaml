appId: com.musically.studio
---
- launchApp:
    clearState: true

# 1. Start at Home (Studio) Tab
- assertVisible: "Studio"

# 2. Discover Tab Navigation
- tapOn: "Discover"
- assertVisible: "Discover"
- swipe:
    direction: UP
# Tap on a track to open the MiniPlayer
- tapOn:
    point: 50%, 50%
# Expand MiniPlayer to Now Playing Screen
- tapOn:
    point: 50%, 90%
- assertVisible: "Shuffle"
- tapOn: "Play"
- tapOn: "Pause"

# 3. Test Now Playing Options (Queue, Lyrics, More Options)
# Note: Maestro searches for accessibility labels, text, or exact text bounds.
# We'll tap some bounds or known icons if text isn't directly visible.
- tapOn: "Queue"
- assertVisible: "Up Next" # Assuming the queue screen has an "Up Next" title
- tapOn: "Back"

- tapOn: "Lyrics"
- tapOn: "Back"

# Collapse Now Playing Screen (Swipe Down)
- swipe:
    direction: DOWN
    duration: 500

# 4. Search Tab
- tapOn: "Search"
- assertVisible: "Search"
- tapOn: "Search" # Tap the search bar
- inputText: "Beethoven"
- pressKey: Enter

# 5. Library Tab
- tapOn: "Library"
- assertVisible: "Library"
- tapOn: "Playlists"
- tapOn: "Artists"
- tapOn: "Liked Songs"

# 6. Podcasts Tab
- tapOn: "Podcasts"
- assertVisible: "Podcasts"

# 7. Profile Tab
- tapOn: "Profile"
- assertVisible: "Settings" # Assuming profile has a Settings button or header

# End Flow
