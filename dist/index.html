    <script>
      (function() {
        const isMutedError = (msg, url) => {
          const m = String(msg || "");
          const u = String(url || "");
          return m.includes("Script error") || 
                 m.includes("ResizeObserver") ||
                 u.includes("html2canvas") || 
                 u.includes("jsdelivr") ||
                 u.includes("sentry") ||
                 (u && !u.includes(window.location.origin) && !u.startsWith("/"));
        };

        window.onerror = function(message, source, lineno, colno, error) {
          if (isMutedError(message, source)) {
            console.warn("Intercepted and silenced cross-origin error:", message, "at", source);
            return true; // prevent default browser handling
          }
          return false; // let normal errors proceed
        };

        window.addEventListener("error", function(event) {
          if (isMutedError(event.message, event.filename)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, { capture: true });

        window.addEventListener("unhandledrejection", function(event) {
          const reason = event.reason;
          const reasonStr = reason ? String(reason.message || reason) : "";
          if (
            reasonStr.includes("Script error") || 
            reasonStr.includes("html2canvas") || 
            reasonStr.includes("jsdelivr") ||
            reasonStr.includes("sentry")
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, { capture: true });
      })();
    </script>
