<style>
        body {

            background-clip: content-box, border-box;
        }
        .waveform-bar {
            width: 3px;
            background: #4cd7f6;
            border-radius: 4px;
            transition: height 0.2s ease;
        }
        .ai-message-sparkle {
            animation: breathe 3s infinite ease-in-out;
        }

            0%, 100% { opacity: 0.6; transform: scale(0.9); }

<script>
        // Simple micro-interaction for waveform animation
        document.querySelectorAll('.waveform-bar').forEach(bar => {
            setInterval(() => {
                const height = Math.floor(Math.random() * 80) + 20;
                if (!bar.classList.contains('opacity-30')) {
                    bar.style.height = height + '%';
                }
            }, Math.random() * 200 + 100);
        });

        // Focus ring logic for the input wrapper
        const input = document.querySelector('input');
        const inputWrapper = input.closest('.glass-panel');
        input.addEventListener('focus', () => {
            inputWrapper.classList.add('glow-border-active');
        });
        input.addEventListener('blur', () => {
            inputWrapper.classList.remove('glow-border-active');
        });
    </script>
